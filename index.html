<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ТТК — карточки</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1d1b18;--mute:#6f6a62;--line:#e3ddd3;--acc:#8a5a2b;--accbg:#f1e6d8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16140f;--card:#211e18;--ink:#f1ece3;--mute:#a39b8d;--line:#38332a;--acc:#e0b07a;--accbg:#3a2f20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16140f;--card:#211e18;--ink:#f1ece3;--mute:#a39b8d;--line:#38332a;--acc:#e0b07a;--accbg:#3a2f20;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;padding:12px 14px 90px}
.top{display:flex;gap:8px;align-items:center;margin-bottom:12px}
select,button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
select{flex:1;min-width:0}
.cnt{color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;transition:transform .16s ease-in;min-height:56vh;user-select:none}
.card.out{transform:perspective(900px) rotateY(90deg)}
.front{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;min-height:calc(56vh - 36px);gap:10px}
.chip{display:inline-block;background:var(--accbg);color:var(--acc);border-radius:99px;padding:3px 11px;font-size:13px}
.front h1{margin:6px 0;font-size:28px;line-height:1.2;overflow-wrap:anywhere}
.hint{color:var(--mute);font-size:14px;margin-top:10px}
.back h2{margin:0 0 12px;font-size:19px;line-height:1.25;overflow-wrap:anywhere}
.sec{margin-top:16px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600;white-space:nowrap}
td:first-child{font-weight:600}
.t{white-space:pre-line;overflow-wrap:anywhere;margin:4px 0}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.nav button{flex:1;max-width:200px;font-size:17px}
.nav button.on{background:var(--accbg);color:var(--acc);border-color:var(--acc)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{display:flex;gap:6px;margin-bottom:10px;background:var(--line);padding:4px;border-radius:14px}
.tabs button{flex:1;border:0;background:transparent;padding:9px}
.tabs button.on{background:var(--card);color:var(--acc);font-weight:600}
#list,#chips,#fold{display:none}
.ml #list{display:block}.ml #chips{display:flex}.ml #fold{display:inline-block}
.ml #card,.ml .nav{display:none}
#chips{gap:6px;overflow-x:auto;margin:0 -14px 8px;padding:0 14px 4px}
.jump{white-space:nowrap;padding:6px 12px;border-radius:99px;font-size:14px}
.lsec{margin-top:14px}
.lh{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:8px 2px;font-weight:700;font-size:18px;color:var(--acc);border-bottom:2px solid var(--acc)}
.lc{font-size:13px;color:var(--mute);font-weight:400}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:10px 0;padding:0 14px}
.item>summary{cursor:pointer;padding:12px 0;font-weight:700;font-size:17px;line-height:1.25;list-style:none;overflow-wrap:anywhere}
.item>summary::-webkit-details-marker{display:none}
.item>summary::before{content:"▾";color:var(--acc);margin-right:8px}
.item:not([open])>summary::before{content:"▸"}
.item[open]>summary{border-bottom:1px solid var(--line)}
.item .chip{margin-right:8px;font-weight:400}
.item .back{padding-bottom:14px}
#train{display:none}.mt #train{display:block}.mt #card,.mt .nav,.mt .top,.mt #chips{display:none}
.pri{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--acc)}
.row{display:flex;gap:8px;margin-top:14px}.row button{flex:1}
.tbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.tbox h1,.tbox h2{margin:4px 0 10px}.tbox p{margin:8px 0}.mute{color:var(--mute);font-size:14px}
.big{font-size:26px;font-weight:700;text-align:center;margin:26px 0;overflow-wrap:anywhere}
.ok{background:#2e7d4f;color:#fff;border-color:#2e7d4f}.no{background:#b3402f;color:#fff;border-color:#b3402f}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs"><button id="tabC" class="on">Карточки</button><button id="tabL">Список</button><button id="tabT">Тренировка</button></div>
  <div class="top"><select id="cat" aria-label="Раздел"></select><button id="fold">Свернуть все</button><span class="cnt" id="cnt"></span></div>
  <div id="chips"></div>
  <div class="card" id="card" role="button" tabindex="0"></div>
  <div id="list"></div>
  <div id="train"></div>
</div>
<div class="nav">
  <button id="prev" aria-label="Назад">←</button>
  <button id="shuf">Вперемешку</button>
  <button id="next" aria-label="Вперёд">→</button>
</div>

const cats=["Все"].concat([...new Set(DATA.map(d=>d.cat))]);
let mode="card",list=DATA.slice(),idx=0,back=false,shuf=false,busy=false;
cats.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;$("cat").appendChild(o)});
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function sec(label,node){const s=el("div","sec");s.appendChild(el("div","lbl",label));s.appendChild(node);return s}
function render(){
  const c=list[idx],card=$("card");card.textContent="";
  $("cnt").textContent=(idx+1)+" / "+list.length;
  if(!back){
    const f=el("div","front");
    f.appendChild(el("span","chip",c.cat));
    if(c.group)f.appendChild(el("div","hint",c.group));
    f.appendChild(el("h1",null,c.title));
    f.appendChild(el("div","hint","Нажми, чтобы перевернуть"));
    card.appendChild(f);
  }else{card.appendChild(backNode(c))}
}
function backNode(c,noTitle){
    const b=el("div","back");
    if(!noTitle)b.appendChild(el("h2",null,c.title));
    if(c.ings.length){
      const w=el("div","tbl"),t=document.createElement("table"),h=document.createElement("tr");
      ["Ингредиенты"].concat(c.cols).forEach(x=>h.appendChild(el("th",null,x)));
      t.appendChild(h);
      c.ings.forEach(r=>{const tr=document.createElement("tr");r.forEach(x=>tr.appendChild(el("td",null,x)));t.appendChild(tr)});
      w.appendChild(t);b.appendChild(sec("Состав",w));
    }
    if(c.steps.length){const d=el("div");c.steps.forEach(s=>d.appendChild(el("div","t",s)));b.appendChild(sec("Технология приготовления",d))}
    c.serve.forEach(s=>b.appendChild(sec(s.l,el("div","t",s.t))));
    if(c.comment)b.appendChild(sec("Комментарий",el("div","t",c.comment)));
    if(c.time)b.appendChild(sec("Время приготовления",el("div","t",c.time)));
    c.extra.forEach(s=>b.appendChild(sec(s.l,el("div","t",s.t))));
  return b;
}

function flip(){
  if(busy)return;busy=true;
  const card=$("card");card.classList.add("out");
  setTimeout(()=>{back=!back;render();card.style.transition="none";card.style.transform="perspective(900px) rotateY(-90deg)";
    void card.offsetWidth;card.style.transition="";card.style.transform="";card.classList.remove("out");busy=false},160);
}
function go(d){idx=(idx+d+list.length)%list.length;back=false;render();window.scrollTo(0,0)}
function rebuild(){
  const c=$("cat").value;list=DATA.filter(x=>c==="Все"||x.cat===c);
  if(shuf)for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}
  idx=0;back=false;render();buildList();if(mode==="list")setMode("list");
}
$("cat").onchange=rebuild;
$("shuf").onclick=()=>{shuf=!shuf;$("shuf").classList.toggle("on",shuf);rebuild()};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
$("card").onclick=flip;
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(1);else if(e.key==="ArrowLeft")go(-1);else if(e.key===" "||e.key==="Enter"){if(e.target===$("card")){e.preventDefault();flip()}}});
let sx=null;
$("card").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("card").addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>60){e.preventDefault();go(dx<0?1:-1)}});
function buildList(){
  const L=$("list"),ch=$("chips");L.textContent="";ch.textContent="";
  const c=$("cat").value;
  cats.slice(1).filter(x=>c==="Все"||x===c).forEach(name=>{
    const items=DATA.filter(d=>d.cat===name);
    const s=el("section","lsec"),h=el("div","lh");
    h.appendChild(el("span",null,name));h.appendChild(el("span","lc",String(items.length)));s.appendChild(h);
    items.forEach(d=>{
      const dt=document.createElement("details");dt.className="item";dt.open=true;
      const sm=document.createElement("summary");
      if(d.group)sm.appendChild(el("span","chip",d.group));
      sm.appendChild(document.createTextNode(d.title));
      dt.appendChild(sm);dt.appendChild(backNode(d,true));s.appendChild(dt);
    });
    L.appendChild(s);
    if(c==="Все"){const b=el("button","jump",name);b.onclick=()=>s.scrollIntoView({behavior:"smooth",block:"start"});ch.appendChild(b)}
  });
}
function setMode(m){
  mode=m;document.body.classList.toggle("ml",m==="list");document.body.classList.toggle("mt",m==="train");
  $("tabC").classList.toggle("on",m==="card");$("tabL").classList.toggle("on",m==="list");$("tabT").classList.toggle("on",m==="train");
  if(m==="list"){const c=$("cat").value;$("cnt").textContent=DATA.filter(d=>c==="Все"||d.cat===c).length+" шт."}else if(m==="train")trainHome();else render();
  window.scrollTo(0,0);
}
$("tabC").onclick=()=>setMode("card");$("tabL").onclick=()=>setMode("list");
$("fold").onclick=()=>{const all=[...document.querySelectorAll("details.item")],o=all.some(x=>x.open);all.forEach(x=>x.open=!o);$("fold").textContent=o?"Развернуть все":"Свернуть все"};
$("tabT").onclick=()=>setMode("train");
const SK="ttk_progress_v1",DAYS=[0,1,3,7,14],DAY=864e5;
let P={};try{P=JSON.parse(localStorage.getItem(SK)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(SK,JSON.stringify(P))}catch(e){}};
const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const TD=[],seenK=new Set();DATA.forEach(d=>{const k=d.title+JSON.stringify(d.ings);if(!seenK.has(k)){seenK.add(k);TD.push(d)}});
let S=null,rst=false;
function btn(txt,cls,fn){const b=el("button",cls||"",txt);b.onclick=fn;return b}
function row(...b){const r=el("div","row");b.forEach(x=>r.appendChild(x));return r}
function fmt(ms){const s=Math.floor(ms/1e3);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function trainHome(){
  if(S&&S.tm)clearInterval(S.tm);S=null;
  const T=$("train");T.textContent="";const now=Date.now(),b=el("div","tbox");
  const nw=TD.filter(d=>!P[d.id]),due=TD.filter(d=>P[d.id]&&P[d.id].due<=now),kn=TD.filter(d=>P[d.id]&&P[d.id].b>=2);
  b.appendChild(el("h1",null,"Тренировка"));
  b.appendChild(el("p",null,"Новые: "+nw.length+"  ·  Учу: "+(TD.length-nw.length-kn.length)+"  ·  Знаю: "+kn.length));
  b.appendChild(el("div","lbl","Как это работает"));
  ["1. Блок из 5 карточек: читаешь, закрываешь, пересказываешь вслух состав и граммовки.","2. Сразу проверка этого блока без подсказки. Не вспомнил — карточка вернётся через несколько штук.","3. Финальный круг: все карточки вперемешку. Это то, что фиксирует память.","4. Завтра и дальше: кнопка «Повтор на сегодня». Карточки приходят через 1, 3, 7, 14 дней."].forEach(x=>b.appendChild(el("p","mute",x)));
  if(nw.length)b.appendChild(row(btn("Учить новые: "+nw.length+" шт., около "+nw.length*2+" мин","pri",()=>startNew(nw))));
  if(due.length)b.appendChild(row(btn("Повтор на сегодня: "+due.length,nw.length?"":"pri",()=>start(mix(due).map(d=>({d,k:"final"})),"Повтор"))));
  const r=btn(rst?"Точно сбросить?":"Сбросить прогресс","",()=>{if(!rst){rst=true;trainHome();return}rst=false;P={};save();trainHome()});
  b.appendChild(row(r));T.appendChild(b);
}
function startNew(cards){
  const q=[],nb=Math.ceil(cards.length/5);
  for(let i=0;i<nb;i++){const bl=cards.slice(i*5,i*5+5);bl.forEach(d=>q.push({d,k:"study",bi:i+1,nb}));mix(bl).forEach(d=>q.push({d,k:"test",bi:i+1,nb}))}
  mix(cards).forEach(d=>q.push({d,k:"final"}));start(q,"Новые");
}
function start(q,name){S={q,i:0,t0:Date.now(),miss:0,name,show:false,hint:false};S.tm=setInterval(()=>{const e=$("tm");if(e)e.textContent=fmt(Date.now()-S.t0)},1000);run()}
function run(){
  const T=$("train");T.textContent="";
  if(S.i>=S.q.length){done();return}
  const it=S.q[S.i],d=it.d,b=el("div","tbox");
  const lab=it.k==="study"?"Блок "+it.bi+" из "+it.nb+" · Изучение":it.k==="test"?"Блок "+it.bi+" из "+it.nb+" · Проверка":S.name==="Новые"?"Финальный круг":"Повтор";
  const h=el("div","mute");h.textContent=lab+"  ·  ";const tm=el("span",null,fmt(Date.now()-S.t0));tm.id="tm";h.appendChild(tm);b.appendChild(h);
  const bar=el("div","bar"),i=document.createElement("i");i.style.width=Math.round(S.i/S.q.length*100)+"%";bar.appendChild(i);b.appendChild(bar);
  if(it.k==="study"){
    b.appendChild(backNode(d));
    b.appendChild(el("p","mute","Прочитай. Закрой глаза и пересказывай вслух состав и граммовки. Потом дальше."));
    b.appendChild(row(btn("Дальше","pri",()=>{S.i++;run();window.scrollTo(0,0)})));
  }else{
    b.appendChild(el("div","chip",d.cat));b.appendChild(el("div","big",d.title));
    if(!S.show){
      b.appendChild(el("p","mute","Вспомни состав и граммовки, вслух или в уме. Только потом смотри ответ."));
      if(S.hint){const l=el("div","t",d.ings.map(r=>"• "+r[0]).join("\n"));b.appendChild(l)}
      b.appendChild(row(btn("Подсказка","",()=>{S.hint=true;run()}),btn("Показать ответ","pri",()=>{S.show=true;run()})));
    }else{
      b.appendChild(backNode(d,true));
      b.appendChild(row(btn("Не знаю","no",()=>ans(false)),btn("Знаю всё","ok",()=>ans(true))));
    }
  }
  T.appendChild(b);
}
function ans(ok){
  const it=S.q[S.i],d=it.d;
  if(it.k==="final"&&!it.again){const p=P[d.id]||{b:0,due:0};if(ok&&!S.hint)p.b=Math.min(p.b+1,4);else if(!ok)p.b=0;p.due=Date.now()+DAYS[p.b]*DAY;P[d.id]=p;save()}
  if(!ok){S.miss++;S.q.splice(Math.min(S.i+5,S.q.length),0,{d,k:it.k,bi:it.bi,nb:it.nb,again:true})}
  S.i++;S.show=false;S.hint=false;run();window.scrollTo(0,0);
}
function done(){
  clearInterval(S.tm);const T=$("train");T.textContent="";const b=el("div","tbox");
  b.appendChild(el("h1",null,"Сессия закончена"));
  b.appendChild(el("p",null,"Время: "+fmt(Date.now()-S.t0)+"  ·  Промахов: "+S.miss));
  b.appendChild(el("p","mute","Вернись завтра и нажми «Повтор на сегодня». Именно это превращает «выучил» в «помню»."));
  b.appendChild(row(btn("На главную","pri",trainHome)));T.appendChild(b);
}
render();buildList();
</script>
</body>
</html>
